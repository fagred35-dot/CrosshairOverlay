name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: dotnet build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore CrosshairOverlay/CrosshairOverlay.csproj

      - name: Build (Release)
        run: dotnet build CrosshairOverlay/CrosshairOverlay.csproj -c Release --no-restore

      - name: Smoke publish (no upload)
        run: >
          dotnet publish CrosshairOverlay/CrosshairOverlay.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -o publish
